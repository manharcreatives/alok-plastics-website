name: Deploy to Hostinger

# Builds the static Next.js export (out/) and uploads it to Hostinger over FTPS.
# Runs on every push to main (and can be started by hand from the Actions tab).
#
# Required GitHub secrets (Settings -> Secrets and variables -> Actions):
#   FTP_SERVER                     e.g. ftp.alokplastics.com  (or the IP shown in hPanel)
#   FTP_USERNAME                   the FTP account you created for the alokplastics.com website
#   FTP_PASSWORD                   that account's password
#   NEXT_PUBLIC_CLIENT_WHATSAPP    optional, e.g. 919812345678 (no + or spaces)
#
# One-time server setup (not done by CI): create api/config.php, admin/config.php and
# data/settings.json inside the website root. They are excluded below so deploys never
# overwrite or delete them.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at the same time.
concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        # pnpm-lock.yaml is lockfileVersion 9.0 -> pnpm 9.
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static export
        run: pnpm build
        env:
          NEXT_PUBLIC_CLIENT_WHATSAPP: ${{ secrets.NEXT_PUBLIC_CLIENT_WHATSAPP }}

      - name: Deploy out/ to Hostinger (FTPS)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          security: loose
          local-dir: ./out/
          # CHANGE THIS if your alokplastics.com website does not use the account root.
          # hPanel -> that website -> File Manager shows the document root.
          # Common values: /public_html/  or  /domains/alokplastics.com/public_html/
          server-dir: /public_html/
          # The sync deletes server files that are not in out/, so protect the files that
          # only ever live on the server (secrets + runtime data the admin panel writes).
          exclude: |
            **/api/config.php
            **/admin/config.php
            **/admin/hash.php
            **/data/settings.json
            **/data/careers.json
            **/data/products.json
            **/data/product-overrides.json
            **/admin/data/**
            **/.well-known/**
            **/.env
            **/.env.*
